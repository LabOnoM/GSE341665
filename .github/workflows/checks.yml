name: Code and evidence checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environment/python-lock.txt
      - run: python -m pip install -r environment/python-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q reproduce.py validate.py pipeline environment tests
      - run: bash -n pipeline/04_download_scref.sh
