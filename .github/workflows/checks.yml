name: Code and evidence checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environment/python-lock.txt
      - run: python -m pip install -r environment/python-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q reproduce.py validate.py verify_data_package.py pipeline environment tests
      - run: bash -n pipeline/04_download_scref.sh
  program-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.3.2'
          use-public-rspm: true
      - run: Rscript environment/setup_program.R --library "$RUNNER_TEMP/program-library" --install
      - run: Rscript pipeline/check_program_environment.R
        env:
          PROGRAM_R_LIBRARY: ${{ runner.temp }}/program-library
      - run: Rscript tests/test_program_models.R
        env:
          PROGRAM_R_LIBRARY: ${{ runner.temp }}/program-library
